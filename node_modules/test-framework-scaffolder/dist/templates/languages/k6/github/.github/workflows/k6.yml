name: k6 Performance
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      environment: { description: Test-data filename, required: true, default: smoke, type: string }
      profile: { description: Load profile, required: true, default: smoke, type: choice, options: [smoke, load, stress, spike] }
jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: grafana/setup-k6-action@v1
      - run: node scripts/run-k6.mjs --env "${{ inputs.environment || 'smoke' }}" --profile "${{ inputs.profile || 'smoke' }}"
