name: Playwright Java
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      environment: { description: Environment/test-data filename, required: true, default: smoke, type: string }
jobs:
  test:
    runs-on: ubuntu-latest
    env: { TEST_ENV: "${{ inputs.environment || 'smoke' }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - run: mvn --batch-mode test
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: reports, path: "reports/\ntest-results/\ntarget/surefire-reports/", if-no-files-found: ignore }
