name: Playwright JavaScript
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      environment: { description: Environment/test-data filename, required: true, default: smoke, type: string }
jobs:
  test:
    runs-on: ubuntu-latest
    env: { TEST_ENV: "${{ inputs.environment || 'smoke' }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm test
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: reports, path: "reports/\ntest-results/\nplaywright-report/", if-no-files-found: ignore }
