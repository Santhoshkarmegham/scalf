name: Playwright Python
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      environment: { description: Environment/test-data filename, required: true, default: smoke, type: string }
jobs:
  test:
    runs-on: ubuntu-latest
    env: { TEST_ENV: "${{ inputs.environment || 'smoke' }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps
      - run: python -m pytest
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: reports, path: "reports/\ntest-results/", if-no-files-found: ignore }
